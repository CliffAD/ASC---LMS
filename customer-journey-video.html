<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#201a17">
  <title>Asha Sweets Center — Customer Journey Motion Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #171412;
      color: #fffaf1;
      font-synthesis: none;
      --gold: #e8ba70;
      --cream: #fff4dc;
      --muted: #b7aaa0;
      --panel: #241e1a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(128, 69, 37, .22), transparent 55%),
        #171412;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .studio {
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 500;
      letter-spacing: -.025em;
    }

    .runtime {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .player {
      overflow: hidden;
      border: 1px solid rgba(255, 244, 220, .16);
      border-radius: 14px;
      background: #0e0b0a;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .45);
    }

    .screen {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #d78b51;
    }

    .screen svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .shot {
      opacity: 0;
      visibility: hidden;
      transition: opacity .65s ease, visibility .65s;
    }

    .shot.is-active {
      opacity: 1;
      visibility: visible;
    }

    .shot.is-active .enter {
      animation: enter .75s cubic-bezier(.2, .75, .25, 1) both;
    }

    .shot.is-active .enter-late {
      animation: enter .75s .25s cubic-bezier(.2, .75, .25, 1) both;
    }

    .shot.is-active .float {
      animation: float 3s ease-in-out infinite;
    }

    .shot.is-active .glow {
      animation: glow 2.8s ease-in-out infinite alternate;
    }

    .shot.is-active .walk-in {
      animation: walk-in 2.4s .35s cubic-bezier(.2, .75, .25, 1) both;
    }

    .shot.is-active .bow {
      transform-box: fill-box;
      transform-origin: center;
      animation: bow .8s .9s cubic-bezier(.2, .8, .2, 1.4) both;
    }

    .shot.is-active .check {
      transform-box: fill-box;
      transform-origin: center;
      animation: pop .45s .2s cubic-bezier(.2, .8, .2, 1.5) both;
    }

    .shot.is-active .scale-needle {
      transform-box: fill-box;
      transform-origin: 12% 50%;
      animation: needle 1.1s .35s ease-out both;
    }

    .scene-vignette {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 7, 5, .08), transparent 28%, transparent 68%, rgba(10, 7, 5, .2));
    }

    .caption {
      position: absolute;
      z-index: 2;
      right: 7%;
      bottom: 7%;
      left: 7%;
      display: flex;
      min-height: 64px;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 8px;
      background: rgba(18, 13, 10, .78);
      color: #fffdf8;
      text-align: center;
      text-shadow: 0 1px 3px #000;
      backdrop-filter: blur(7px);
    }

    .caption-copy { max-width: 920px; }

    .speaker {
      display: block;
      margin-bottom: 3px;
      color: #f0c77e;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .caption-text {
      font-size: clamp(13px, 1.65vw, 19px);
      font-weight: 600;
      line-height: 1.4;
    }

    .status {
      position: absolute;
      z-index: 3;
      top: 18px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #fff9ed;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-shadow: 0 2px 6px rgba(0, 0, 0, .65);
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e8ba70;
      box-shadow: 0 0 12px #ffd487;
    }

    .timeline {
      height: 4px;
      background: #40332b;
    }

    .timeline-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #ba713d, #f1cf8a);
    }

    .transport {
      display: grid;
      grid-template-columns: auto auto minmax(100px, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: #211b17;
    }

    .control {
      min-width: 82px;
      padding: 9px 13px;
      border: 1px solid rgba(255, 244, 220, .18);
      border-radius: 6px;
      background: #332820;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: background .2s, border-color .2s;
    }

    .control:hover, .control[aria-pressed="true"] {
      border-color: rgba(232, 186, 112, .65);
      background: #4a3525;
    }

    .seek {
      width: 100%;
      accent-color: #e8ba70;
      cursor: pointer;
    }

    .clock {
      min-width: 86px;
      color: #ddd0c5;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .scene-nav {
      display: flex;
      gap: 7px;
      margin-top: 12px;
      overflow-x: auto;
      padding: 2px 0 8px;
      scrollbar-color: #614631 transparent;
    }

    .scene-button {
      flex: 1 0 112px;
      min-height: 50px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 244, 220, .11);
      border-radius: 7px;
      background: #211b17;
      color: #c1b4a9;
      cursor: pointer;
      text-align: left;
      transition: background .2s, color .2s, border-color .2s;
    }

    .scene-button span {
      display: block;
      margin-bottom: 3px;
      color: #8e7c6f;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .scene-button strong { font-size: 12px; }

    .scene-button.is-current {
      border-color: rgba(232, 186, 112, .7);
      background: #3a2a1e;
      color: #fff4dc;
    }

    .scene-button.is-current span { color: #e8ba70; }

    .production-note {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 12px 2px 0;
      color: #aa9d92;
      font-size: 12px;
      line-height: 1.5;
    }

    .production-note strong { color: #d9c8b7; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes glow {
      from { opacity: .7; filter: drop-shadow(0 0 3px rgba(255, 198, 102, .3)); }
      to { opacity: 1; filter: drop-shadow(0 0 13px rgba(255, 198, 102, .9)); }
    }

    @keyframes walk-in {
      from { opacity: 0; transform: translateX(90px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes bow {
      from { opacity: 0; transform: scale(.2) rotate(-20deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.15); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes needle {
      from { transform: rotate(-18deg); }
      to { transform: rotate(0); }
    }

    @media (max-width: 640px) {
      .studio { width: min(100% - 20px, 1240px); padding-top: 18px; }
      .masthead { align-items: flex-start; }
      .runtime { padding-top: 5px; font-size: 11px; }
      .status { top: 9px; left: 10px; font-size: 9px; }
      .caption { right: 4%; bottom: 5%; left: 4%; min-height: 45px; padding: 7px 10px; }
      .speaker { margin-bottom: 1px; font-size: 9px; }
      .transport { grid-template-columns: auto auto minmax(50px, 1fr); gap: 8px; padding: 10px; }
      .control { min-width: 0; padding: 8px 10px; font-size: 11px; }
      .clock { grid-column: 3; min-width: 0; margin-top: -6px; font-size: 10px; }
      .production-note { flex-direction: column; gap: 4px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const scenes = [
        {
          title: "Storefront", duration: 8,
          cues: [{ at: 0, speaker: "Voiceover", text: "Welcome to Asha Sweets Center, where every sweet is made fresh, every day." }]
        },
        {
          title: "Greeting", duration: 12,
          cues: [
            { at: 0, speaker: "Staff", text: "Namaste! Welcome to Asha Sweets. What can I get for you today?" },
            { at: 6, speaker: "Customer", text: "Hi! I'd like a box of kaju katli, and maybe a couple of laddoos." }
          ]
        },
        {
          title: "Choosing sweets", duration: 15,
          cues: [
            { at: 0, speaker: "Staff", text: "Our kaju katli was made this morning. Would you like to try a piece first?" },
            { at: 6, speaker: "Customer", text: "Oh, that's perfect. Let's do half a kilo." },
            { at: 10, speaker: "Staff", text: "Lovely choice. And the laddoos are right here, fresh today." }
          ]
        },
        {
          title: "Weighing & packing", duration: 15,
          cues: [
            { at: 0, speaker: "Staff", text: "Half a kilo, freshly packed. Would you like it gift-wrapped?" },
            { at: 6, speaker: "Customer", text: "Yes, please. It's a gift." },
            { at: 9, speaker: "Staff", text: "Wonderful. We'll make it look special." }
          ]
        },
        {
          title: "Billing", duration: 20,
          cues: [
            { at: 0, speaker: "Staff", text: "Your total comes to 850 rupees. How would you like to pay: card, UPI, or cash?" },
            { at: 7, speaker: "Customer", text: "UPI, please." },
            { at: 9, speaker: "Staff", text: "Great. Just scan this QR code." },
            { at: 12, speaker: "Staff", text: "Payment received. Here's your bill. You can also get a copy on WhatsApp if you'd like." }
          ]
        },
        {
          title: "Thank you & farewell", duration: 15,
          cues: [
            { at: 0, speaker: "Staff", text: "Thank you for choosing Asha Sweets. Enjoy, and we'll see you again soon!" },
            { at: 8, speaker: "Customer", text: "Thank you, Asha! Everything was wonderful." }
          ]
        },
        {
          title: "Closing card", duration: 5,
          cues: [{ at: 0, speaker: "Voiceover", text: "Asha Sweets Center. Thank you for your visit." }]
        }
      ];

      const starts = [];
      let totalDuration = 0;
      scenes.forEach(scene => {
        starts.push(totalDuration);
        totalDuration += scene.duration;
      });

      const film = document.getElementById("film");
      const shotElements = [...film.querySelectorAll("[data-shot]")];
      const buttons = document.getElementById("scene-nav");
      const playButton = document.getElementById("play");
      const seek = document.getElementById("seek");
      const clock = document.getElementById("clock");
      const caption = document.getElementById("caption");
      const speaker = document.getElementById("speaker");
      const sceneLabel = document.getElementById("scene-label");
      const timelineFill = document.getElementById("timeline-fill");

      let currentTime = 0;
      let activeScene = -1;
      let playing = false;
      let lastFrame = 0;
      let animationFrame = 0;

      const timeText = seconds => {
        const whole = Math.floor(seconds);
        return `${Math.floor(whole / 60)}:${String(whole % 60).padStart(2, "0")}`;
      };

      scenes.forEach((scene, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "scene-button";
        button.innerHTML = `<span>Scene ${index + 1} · ${timeText(starts[index])}</span><strong>${scene.title}</strong>`;
        button.addEventListener("click", () => {
          pause();
          setTime(starts[index]);
        });
        buttons.append(button);
      });

      function sceneAt(seconds) {
        for (let index = scenes.length - 1; index >= 0; index -= 1) {
          if (seconds >= starts[index]) return index;
        }
        return 0;
      }

      function setTime(seconds) {
        currentTime = Math.max(0, Math.min(totalDuration, seconds));
        const index = sceneAt(Math.min(currentTime, totalDuration - .001));
        const localTime = currentTime - starts[index];

        if (index !== activeScene) {
          activeScene = index;
          shotElements.forEach((shot, shotIndex) => shot.classList.toggle("is-active", shotIndex === index));
          [...buttons.children].forEach((button, buttonIndex) => button.classList.toggle("is-current", buttonIndex === index));
          sceneLabel.textContent = `Scene ${index + 1} · ${scenes[index].title}`;
        }

        let cue = scenes[index].cues[0];
        scenes[index].cues.forEach(item => {
          if (localTime >= item.at) cue = item;
        });
        speaker.textContent = cue.speaker;
        caption.textContent = cue.text;
        seek.value = currentTime;
        clock.textContent = `${timeText(currentTime)} / ${timeText(totalDuration)}`;
        timelineFill.style.width = `${(currentTime / totalDuration) * 100}%`;
      }

      function tick(now) {
        if (!playing) return;
        if (!lastFrame) lastFrame = now;
        currentTime += (now - lastFrame) / 1000;
        lastFrame = now;
        if (currentTime >= totalDuration) {
          currentTime = totalDuration;
          setTime(currentTime);
          pause();
          return;
        }
        setTime(currentTime);
        animationFrame = requestAnimationFrame(tick);
      }

      function play() {
        if (currentTime >= totalDuration) setTime(0);
        if (playing) return;
        playing = true;
        lastFrame = 0;
        playButton.textContent = "❚❚ Pause";
        playButton.setAttribute("aria-label", "Pause preview");
        animationFrame = requestAnimationFrame(tick);
      }

      function pause() {
        playing = false;
        cancelAnimationFrame(animationFrame);
        playButton.textContent = "▶ Play";
        playButton.setAttribute("aria-label", "Play preview");
      }

      playButton.addEventListener("click", () => playing ? pause() : play());
      document.getElementById("restart").addEventListener("click", () => {
        pause();
        setTime(0);
      });
      seek.addEventListener("input", () => {
        pause();
        setTime(Number(seek.value));
      });
      document.addEventListener("keydown", event => {
        if (event.code === "Space" && !["INPUT", "BUTTON"].includes(document.activeElement.tagName)) {
          event.preventDefault();
          playing ? pause() : play();
        }
      });

      setTime(0);
    })();
  </script>
